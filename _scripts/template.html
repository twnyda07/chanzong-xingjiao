<meta charset="utf-8">
<title>禪宗．祖師行腳</title>
<style>
  :root{
    --paper:#fbfaf7; --card:#fff; --ink:#23201c; --ink2:#6b645b;
    --rule:#e6e1d8; --accent:#4a5d52; --soft:#eef1ee; --c:#3d6ea6;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:0 0 60px; background:var(--paper); color:var(--ink);
    font-family:"Songti TC","Noto Serif CJK TC","Source Han Serif TC",serif;
    font-size:20px; line-height:1.9;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px;}

  header{padding:46px 0 22px; text-align:center;}
  h1{font-size:40px; margin:0 0 6px; letter-spacing:8px;}
  header .sub{color:var(--ink2); font-size:18px; letter-spacing:3px;}

  .masters{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:26px 0 8px;}
  .m{width:124px; padding:16px 8px 13px; border:1px solid var(--rule); border-radius:8px;
     background:#fff; text-align:center; cursor:pointer; transition:.3s;}
  .m .face{width:68px; height:82px; margin:0 auto 9px; border-radius:36px 36px 30px 30px;
     background:linear-gradient(180deg,#efebe3,#e3ded4); display:flex; align-items:center;
     justify-content:center; color:#b3aa9c; font-size:14px; transition:.4s;}
  .m b{font-size:22px; font-weight:normal; display:block;}
  .m s{font-size:14px; color:var(--ink2); text-decoration:none; display:block; margin-top:2px;}
  .m.on{border-color:transparent; box-shadow:0 0 0 2px var(--mc) inset; transform:translateY(-3px);}
  .m.on .face{background:color-mix(in srgb,var(--mc) 20%,#fff); color:var(--mc);}
  .m.on b{color:var(--mc);}
  .m.todo{opacity:.5; cursor:default;}

  .modes{display:flex; gap:10px; justify-content:center; margin:22px 0 6px;}
  .modes button{font-family:inherit; font-size:18px; padding:11px 28px; border-radius:999px;
    border:1px solid var(--rule); background:#fff; color:var(--ink2); cursor:pointer;}
  .modes button.on{background:var(--soft); border-color:var(--c); color:var(--ink);}

  .note{text-align:center; color:var(--ink2); font-size:15.5px; margin:10px 0 22px;}

  .stage{display:grid; grid-template-columns:1.1fr 1fr; gap:18px; align-items:start;}
  @media (max-width:760px){ .stage{grid-template-columns:1fr;} }

  .mapbox{background:#f7f5f1; border:1px solid var(--rule); border-radius:8px;
    position:relative; height:520px;}
  .mapbox svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .spot{position:absolute; transform:translate(-50%,-50%); background:none; border:0;
    font-family:inherit; cursor:pointer; text-align:center; padding:4px;}
  .spot i{display:block; width:18px; height:18px; border-radius:50%; background:#d9d3c8;
    margin:0 auto 5px; transition:.35s;}
  .spot b{font-size:15px; font-weight:normal; color:var(--ink2); transition:.3s; white-space:nowrap;}
  .spot.lit i{background:var(--c); box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 20%,transparent);}
  .spot.lit b{color:var(--c);}
  .spot.cur i{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 26%,transparent);}
  .spot.next i{border:2px solid var(--c); background:#fff; animation:pulse 1.6s infinite;}
  .spot.next b{color:var(--c);}
  .spot.dim{opacity:.45;}
  /* 地圖上只放圓點，地名放在下面那排大字籤，從根本上不會互相壓字 */
  .spot b{opacity:0; transition:.25s; position:absolute; left:50%;
          transform:translateX(-50%); top:24px; background:var(--paper);
          padding:1px 6px; border-radius:4px;}
  .spot.lit b, .spot.next b, .spot:hover b, .spot:focus b{opacity:1;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0;}
  .chip{font-family:inherit; font-size:18px; padding:9px 18px; border-radius:999px;
    border:1px solid var(--rule); background:#fff; color:var(--ink2); cursor:pointer;}
  .chip .n{font-size:14px; color:#a9a194; margin-left:6px;}
  .chip.on{background:var(--soft); border-color:var(--c); color:var(--c);}
  .chip.nogeo{border-style:dashed;}
  .chip:disabled{cursor:default;}
  .spot.nogeo i{background:#efece5; border:1px dashed #c9c2b4;}
  .spot.nogeo b{color:#9b9387;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent);}
    50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--c) 0%,transparent);}}

  .panel{border:1px solid var(--rule); border-radius:8px; background:#fff;
    padding:24px 26px; min-height:520px; max-height:520px; overflow:auto;}
  .panel .hint{color:var(--ink2); font-size:17px; text-align:center; margin-top:150px;}
  .panel h3{margin:0 0 12px; font-size:26px; font-weight:normal;}
  table.facts{width:100%; border-collapse:collapse; font-size:17px; margin:0 0 16px;}
  table.facts th{text-align:left; font-weight:normal; color:var(--ink2); width:5.5em;
    padding:7px 10px 7px 0; border-bottom:1px solid var(--rule); vertical-align:top;}
  table.facts td{padding:7px 0; border-bottom:1px solid var(--rule);}
  .quote{background:#f7f5f1; border-left:4px solid var(--c); border-radius:4px;
    padding:18px 20px; font-size:21px; line-height:2.05; margin:0 0 8px;}
  .src{font-size:15px; color:var(--ink2);}
  .kws{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0;}
  .kw{background:var(--c); color:#fff; border-radius:6px; padding:12px 20px;
    font-size:26px; letter-spacing:4px; white-space:nowrap;}
  .variant{margin-top:16px; background:#f3f2ee; border:1px dashed var(--rule);
    border-radius:4px; padding:14px 16px; font-size:16px; color:var(--ink2);}
  .prog{text-align:center; color:var(--ink2); font-size:16px; margin:14px 0 0;}
  .nextbtn{display:block; margin:18px auto 0; font-family:inherit; font-size:19px;
    padding:12px 34px; border-radius:999px; border:1px solid var(--c);
    background:var(--c); color:#fff; cursor:pointer;}
  /* ── 七面向檔案 ── */
  #profile{margin-top:40px;}
  .pf h2{font-size:27px; margin:0 0 4px; font-weight:normal; letter-spacing:2px;}
  .pf .alias{color:var(--ink2); font-size:16px; margin:0 0 6px;}
  .sec{border-top:1px solid var(--rule); padding:22px 0 6px;}
  .sec h3{font-size:22px; margin:0 0 14px; font-weight:normal; color:var(--c); letter-spacing:2px;}
  .sec .empty{color:var(--ink2); font-size:16.5px; background:#f5f3ee;
    border:1px dashed var(--rule); border-radius:4px; padding:14px 18px;}
  .ent{margin:0 0 20px; display:grid; grid-template-columns:7.5em 1fr; gap:0 18px;}
  @media (max-width:700px){ .ent{grid-template-columns:1fr; gap:6px;} }
  .ent .lab{font-size:17px; color:var(--ink2); padding-top:3px;}
  .ent .lab s{display:block; text-decoration:none; font-size:14.5px; color:#a9a194; margin-top:2px;}
  .ent .q{background:#fff; border:1px solid var(--rule); border-left:4px solid var(--c);
    border-radius:4px; padding:15px 18px; font-size:19.5px; line-height:2;}
  .ent .q s{display:block; text-decoration:none; font-size:14.5px; color:var(--ink2);
    margin-top:9px; letter-spacing:0;}
  .ppl{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:700px){ .ppl{grid-template-columns:1fr;} }
  .ppl .card{background:#fff; border:1px solid var(--rule); border-radius:6px; padding:16px 18px;}
  .ppl .nm{font-size:20px;}
  .ppl .who{font-size:15px; color:var(--ink2); margin-left:8px;}
  .ppl .q2{font-size:17px; line-height:1.95; color:var(--ink); margin-top:9px;}
  .ppl .rf2{font-size:14px; color:var(--ink2); margin-top:7px;}

  .foot{margin-top:34px; padding-top:18px; border-top:1px solid var(--rule);
    color:var(--ink2); font-size:15.5px; text-align:center; line-height:2;}
  details{margin-top:10px; font-size:15.5px; color:var(--ink2);}
  details summary{cursor:pointer;}
  details li{margin:3px 0;}
</style>

<div class="wrap">
<header>
  <h1>禪宗．祖師行腳</h1>
  <div class="sub">達摩　慧可　僧璨　道信　弘忍　惠能</div>
</header>

<div class="masters" id="masters"></div>

<div class="modes">
  <button id="bMap" class="on">點地圖</button>
  <button id="bLife">一步一步認識他</button>
</div>
<p class="note" id="modeNote"></p>
<p class="note" id="mapNote" style="margin-top:-14px; font-size:14.5px"></p>

<div class="stage">
  <div><div class="mapbox" id="mapbox"><svg id="paths"></svg></div>
    <div class="chips" id="chips"></div></div>
  <div class="panel" id="panel"><p class="hint">先選一位祖師</p></div>
</div>

<p class="prog" id="prog"></p>

<div id="profile"></div>

<div class="foot">
  實心圓點的位置取自<strong>哈佛・復旦中國歷史地理資訊系統</strong>，依各祖師在世年份查得的治所座標；
  虛線圓點尚未定位。今日的省市仍待補。<br>
  畫面上的引文逐字取自原典，建置時以程式與原典逐字比對，對不上不給編。
  <details id="srcList"><summary>這一位用到的出處</summary><ul id="srcUl"></ul></details>
</div>
</div>

<script>
const DATA = /*__DATA__*/null;
const PROFILES = /*__PROFILES__*/null;
let mi = 0, mode = "map", step = 0, cur = -1;

const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* 有 CHGIS 座標的就用真實經緯度擺位；整組都沒座標才退回示意排列 */
function geoLayout(nodes){
  const g = nodes.map(n => (n.事 ? (n.事.find(e=>e.座標)||{}).座標 : n.座標) || null);
  if(!g.some(Boolean)) return null;
  const xs = g.filter(Boolean).map(c=>c.經度), ys = g.filter(Boolean).map(c=>c.緯度);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if(x1-x0 < 1.5){ const m=(x0+x1)/2; x0=m-0.75; x1=m+0.75; }
  if(y1-y0 < 1.5){ const m=(y0+y1)/2; y0=m-0.75; y1=m+0.75; }
  const out = g.map(c => c ? {
    x: 14 + (c.經度 - x0)/(x1-x0) * 72,
    y: 82 - (c.緯度 - y0)/(y1-y0) * 64,   // 緯度越高越靠上
    geo: true,
  } : null);
  // 同一個治所座標會有好幾個地點（少林寺、香山、洛陽都歸洛陽縣），
  // 疊在一起就看不到字，依固定角度散開一小圈。散開只是為了看得清楚，
  // 座標本身仍是該行政地名的治所點，頁尾已註明。
  const 群 = {};
  out.forEach((p,i)=>{ if(p){ const k=p.x.toFixed(1)+","+p.y.toFixed(1); (群[k]=群[k]||[]).push(i); } });
  Object.values(群).forEach(ids=>{
    if(ids.length<2) return;
    const r = 5.5 + ids.length*0.6;
    ids.forEach((i,k)=>{
      const a = (Math.PI*2*k)/ids.length - Math.PI/2;
      out[i].x += Math.cos(a)*r;
      out[i].y += Math.sin(a)*r*0.72;
      out[i].群 = true;
    });
  });
  return out;
}

/* 行腳示意位置：依站序蛇行排列，不是地理座標 */
function layout(n){
  const pts = [], cols = Math.min(4, Math.max(2, Math.ceil(Math.sqrt(n))));
  const rows = Math.ceil(n/cols);
  for(let i=0;i<n;i++){
    const r = Math.floor(i/cols), c0 = i%cols;
    const c = (r%2===0) ? c0 : (cols-1-c0);
    pts.push({
      x: 14 + c*(72/Math.max(1,cols-1)),
      y: 16 + r*(68/Math.max(1,rows-1||1))
    });
  }
  return pts;
}

function renderMasters(){
  el("masters").innerHTML = DATA.祖師.map((p,i)=>{
    const has = (p.站||[]).length>0;
    return '<div class="m'+(i===mi&&has?' on':'')+(has?'':' todo')+'" data-i="'+i+'" style="--mc:'+p.色+'">'
      + '<div class="face">'+(has?'畫像':'建置中')+'</div>'
      + '<b>'+esc(p.介面名)+'</b><s>'+(has?(p.站.length+' 站'):'尚未建站')+'</s></div>';
  }).join("");
}

function stations(){ return DATA.祖師[mi].站 || []; }

/* 地圖上一個地方＝一個點，同一地發生的事全部收在那個點底下。
   生平模式才是一站一站照順序走。 */
function places(){
  const out = [], idx = {};
  stations().forEach((s,i)=>{
    const key = s.地 || "（原典未載地點）";
    if(idx[key]===undefined){ idx[key]=out.length; out.push({地:key, 事:[]}); }
    out[idx[key]].事.push(Object.assign({序:i+1}, s));
  });
  return out;
}

function renderMap(){
  const p = DATA.祖師[mi];
  document.documentElement.style.setProperty("--c", p.色);
  const nodes = (mode==="map") ? places() : stations();
  const geo = geoLayout(nodes);
  const fallback = layout(nodes.length);
  const pts = nodes.map((_,i)=> (geo && geo[i]) ? geo[i] : null);
  // 沒有座標的排在底部一條，明寫尚未定位
  let k = 0;
  const 未定位 = pts.filter(p=>!p).length;
  nodes.forEach((_,i)=>{ if(!pts[i]){
    pts[i] = { x: 10 + (k*(80/Math.max(1,未定位-1||1))), y: 93, geo:false }; k++;
  }});
  el("mapNote").textContent = geo
    ? (未定位 ? "實心圓點是歷史地理系統定位的真實位置，虛線框的地名尚未定位。"
              : "圓點是歷史地理系統定位的真實位置。")
    : "這一位的地點尚未定位，圓點為示意排列。";
  const box = el("mapbox");
  box.querySelectorAll(".spot").forEach(n=>n.remove());
  nodes.forEach((s,i)=>{
    const b = document.createElement("button");
    b.className = "spot" + (pts[i].geo ? "" : " nogeo");
    b.style.left = pts[i].x+"%"; b.style.top = pts[i].y+"%";
    b.dataset.i = i;
    const label = (mode==="map") ? s.地 : (s.地 || "（原典未載地點）");
    const badge = (mode==="map" && s.事.length>1)
      ? '<em style="font-style:normal; font-size:13.5px; color:var(--ink2)">　'+s.事.length+' 件</em>' : "";
    b.innerHTML = '<i></i><b>'+esc(label)+badge+'</b>';
    box.appendChild(b);
  });
  // 連線
  const gp = pts.filter(q=>q.geo);
  const d = gp.map((q,i)=>(i?"L":"M")+q.x+" "+q.y).join(" ");
  el("paths").innerHTML = '<path d="'+d+'" fill="none" stroke="'+p.色
    + '" stroke-opacity=".22" stroke-width=".6" vector-effect="non-scaling-stroke"/>';
  el("paths").setAttribute("viewBox","0 0 100 100");
  el("paths").setAttribute("preserveAspectRatio","none");
  el("chips").innerHTML = nodes.map((s,i)=>{
    const label = (mode==="map") ? s.地 : (s.地 || "（原典未載地點）");
    const n = (mode==="map" && s.事.length>1) ? '<span class="n">'+s.事.length+' 件</span>' : "";
    return '<button class="chip'+(pts[i].geo?"":" nogeo")+'" data-i="'+i+'">'
      + esc(label) + n + '</button>';
  }).join("");
  paintSpots();
  renderSources();
  renderProfile();
}

/* 標籤避讓：撞到就把字翻到點的上方，再撞就往下拉開。
   只動標籤的排版，圓點位置（也就是座標）完全不動。 */
function decollide(){
  const sp = [...document.querySelectorAll(".spot")];
  sp.forEach(b=>b.classList.remove("up","far"));
  const box = () => sp.map(b=>b.getBoundingClientRect());
  const modes = ["up", "lft", "rgt"];
  for(let pass=0; pass<3; pass++){
    const r = box();
    for(let i=0;i<sp.length;i++){
      for(let j=i+1;j<sp.length;j++){
        const a=r[i], c=r[j];
        const hit = !(a.right < c.left || c.right < a.left ||
                      a.bottom < c.top || c.bottom < a.top);
        if(hit){
          const t = sp[j];
          if(!modes.some(m=>t.classList.contains(m))) t.classList.add(modes[pass % 3]);
          else { t.classList.remove("up","lft","rgt"); t.classList.add(modes[(pass+1) % 3]); }
        }
      }
    }
  }
}

function paintSpots(){
  document.querySelectorAll(".chip").forEach((c,i)=>{
    const on = (mode==="map") ? (i===cur) : (i<step);
    c.classList.toggle("on", on);
    c.disabled = (mode!=="map" && i!==step);
  });
  document.querySelectorAll(".spot").forEach((b,i)=>{
    b.className = "spot";
    if(mode==="map"){
      if(i===cur) b.classList.add("lit","cur");
    } else {
      if(i<step) b.classList.add("lit");
      else if(i===step) b.classList.add("next");
      else b.classList.add("dim");
      if(i===step-1) b.classList.add("cur");
    }
  });
}

function stationHtml(s, head){
  const kws = (s.關鍵詞||[]).map(k=>'<span class="kw">'+esc(k)+'</span>').join("");
  return '<h3>'+head+'</h3>'
    + '<table class="facts">'
    + '<tr><th>地點</th><td>'+esc(s.地 || "原典未載")+'</td></tr>'
    + '<tr><th>今日</th><td>'+(s.今地 ? esc(s.今地) : "待定位") +'</td></tr>'
    + '<tr><th>年代</th><td>'+esc(s.年 || "原典未載")+'</td></tr>'
    + '<tr><th>遇到的人</th><td>'+((s.人&&s.人.length)?s.人.map(esc).join("、"):"—")+'</td></tr>'
    + '<tr><th>出處</th><td>'+esc(s.出處.書名)+'　卷'+s.出處.卷+'</td></tr>'
    + '</table>'
    + '<div class="quote">'+esc(s.原文)+'</div>'
    + '<div class="src">'+esc(s.出處.書名)+'　卷'+s.出處.卷+'　'+esc(s.出處.經號)+'</div>'
    + (kws ? '<div class="kws">'+kws+'</div>' : "")
    + (s.異文提醒 ? '<div class="variant">異文　'+esc(s.異文提醒)+'</div>' : "");
}

function renderPanel(){
  const p = DATA.祖師[mi], st = stations();
  if(mode==="map"){
    if(cur<0){ el("panel").innerHTML = '<p class="hint">點左邊任何一個地方</p>'; el("prog").textContent=""; return; }
    const pl = places()[cur];
    el("panel").innerHTML = '<h3>'+esc(pl.地)+'</h3>'
      + '<table class="facts"><tr><th>今日</th><td>待定位</td></tr>'
      + '<tr><th>在這裡</th><td>' + pl.事.length + ' 件事</td></tr></table>'
      + pl.事.map(ev=>'<div style="margin:0 0 26px">'
          + '<table class="facts">'
          + '<tr><th>年代</th><td>'+esc(ev.年 || "原典未載")+'</td></tr>'
          + '<tr><th>遇到的人</th><td>'+((ev.人&&ev.人.length)?ev.人.map(esc).join("、"):"—")+'</td></tr>'
          + '</table>'
          + '<div class="quote">'+esc(ev.原文)+'</div>'
          + '<div class="src">'+esc(ev.出處.書名)+'　卷'+ev.出處.卷+'　'+esc(ev.出處.經號)+'</div>'
          + ((ev.關鍵詞||[]).length
              ? '<div class="kws">'+ev.關鍵詞.map(k=>'<span class="kw">'+esc(k)+'</span>').join("")+'</div>' : "")
          + (ev.異文提醒 ? '<div class="variant">異文　'+esc(ev.異文提醒)+'</div>' : "")
          + '</div>').join("");
    el("prog").textContent = "";
    return;
  }
  if(step===0){
    el("panel").innerHTML = '<h3>'+esc(p.介面名)+'</h3>'
      + (p.各書異寫 && p.各書異寫.length
          ? '<table class="facts"><tr><th>各書異寫</th><td>'+p.各書異寫.map(esc).join("<br>")+'</td></tr></table>'
          : "")
      + '<p class="hint" style="margin-top:40px">點左邊那盞會跳的燈，從第一站開始</p>';
  } else if(step>st.length){
    const nx = DATA.祖師[mi+1];
    el("panel").innerHTML = '<h3>'+esc(p.介面名)+'　走完了</h3>'
      + '<p style="color:var(--ink2); font-size:17px">一共 '+st.length+' 站，全部點亮。</p>'
      + (nx ? '<button class="nextbtn" onclick="gotoMaster('+(mi+1)+')">接著認識　'
              + esc(nx.介面名) + ((nx.站&&nx.站.length)?'':'（建置中）') + '</button>' : "");
  } else {
    el("panel").innerHTML = stationHtml(st[step-1], "第 "+step+" 站　"+esc(st[step-1].地 || "（原典未載地點）"));
  }
  el("prog").textContent = "已點亮 " + Math.min(step, st.length) + " ／ " + st.length;
}

const 節序 = ["生平", "參學歷程", "開悟因緣", "教學風格", "歷史定位", "交集人物"];

function renderProfile(){
  const p = DATA.祖師[mi];
  const f = (PROFILES && PROFILES.祖師檔案) ? PROFILES.祖師檔案[p.介面名] : null;
  if(!f){ el("profile").innerHTML = ""; return; }
  let h = '<div class="pf"><h2>' + esc(p.介面名) + '</h2>';
  if(p.各書異寫 && p.各書異寫.length)
    h += '<p class="alias">各書異寫　' + p.各書異寫.map(esc).join("　") + '</p>';
  for(const k of 節序){
    const rows = f[k] || [];
    h += '<div class="sec"><h3>' + k + '</h3>';
    if(!rows.length){
      h += '<p class="empty">原典未載。這一項留白，不補寫。</p>';
    } else if(k === "交集人物"){
      h += '<div class="ppl">' + rows.map(c =>
        '<div class="card"><span class="nm">' + esc(c.姓名) + '</span>'
        + (c.身分 ? '<span class="who">' + esc(c.身分) + '</span>' : "")
        + '<div class="q2">' + esc(c.原文) + '</div>'
        + '<div class="rf2">' + esc(c.出處.書名) + '　卷' + c.出處.卷 + '　' + esc(c.出處.經號) + '</div>'
        + '</div>').join("") + '</div>';
    } else {
      h += rows.map(e =>
        '<div class="ent"><div class="lab">' + esc(e.標題)
        + (e.年 ? '<s>' + esc(e.年) + '</s>' : "") + '</div>'
        + '<div class="q">' + esc(e.原文)
        + '<s>' + esc(e.出處.書名) + '　卷' + e.出處.卷 + '　' + esc(e.出處.經號) + '</s>'
        + '</div></div>').join("");
    }
    h += '</div>';
  }
  h += '</div>';
  el("profile").innerHTML = h;
}

function renderSources(){
  const seen = {}, st = stations();
  st.forEach(s=>{ seen[s.出處.書名+"　卷"+s.出處.卷+"（"+s.出處.經號+"）"]=1; });
  el("srcUl").innerHTML = Object.keys(seen).map(k=>'<li>'+esc(k)+'</li>').join("");
}

function gotoMaster(i){
  if(!(DATA.祖師[i].站||[]).length) return;
  mi = i; step = 0; cur = -1;
  renderMasters(); renderMap(); renderPanel();
  window.scrollTo({top:0, behavior:"smooth"});
}

el("masters").addEventListener("click", e=>{
  const m = e.target.closest(".m"); if(!m || m.classList.contains("todo")) return;
  gotoMaster(+m.dataset.i);
});
function pick(i){
  if(mode==="map"){ cur = i; }
  else { if(i!==step) return; step++; }
  paintSpots(); renderPanel();
}
el("mapbox").addEventListener("click", e=>{
  const b = e.target.closest(".spot"); if(b) pick(+b.dataset.i);
});
el("chips").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(c && !c.disabled) pick(+c.dataset.i);
});
function setMode(m){
  mode = m; step = 0; cur = -1;
  el("bMap").classList.toggle("on", m==="map");
  el("bLife").classList.toggle("on", m==="life");
  el("modeNote").textContent = (m==="map")
    ? "點到哪裡，那裡就亮，右邊出現他在那裡說過的話、遇到的人。"
    : "跳動的那盞燈是下一站。一盞一盞點亮，走完他的一生。";
  renderMap(); renderPanel();
}
el("bMap").onclick = ()=>setMode("map");
el("bLife").onclick = ()=>setMode("life");

renderMasters(); renderMap(); setMode("map");
</script>
